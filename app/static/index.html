<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BGP 路由起源 RPKI 核对</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <h1>BGP 路由起源 RPKI 核对</h1>
    <p class="subtitle">RFC 8210 v1 Reset Query 全量 IPv4 授权 · RFC 6483 路由起源校验</p>
  </header>

  <main class="layout">
    <section class="card" aria-labelledby="sync-title">
      <h2 id="sync-title">可信 RTR 源与数据版本</h2>
      <dl class="meta">
        <dt>固定可信源</dt><dd id="rtr-endpoint">-</dd>
        <dt>同步状态</dt><dd id="sync-state">-</dd>
        <dt>当前版本</dt><dd id="version-info">-</dd>
        <dt>到期时刻</dt><dd id="version-expiry">-</dd>
        <dt>授权条数</dt><dd id="version-count">-</dd>
        <dt>查询可用性</dt><dd id="query-available">-</dd>
      </dl>
      <p id="sync-message" class="notice"></p>
      <button id="sync-button" type="button">手动同步全量授权</button>
    </section>

    <section class="card" aria-labelledby="check-title">
      <h2 id="check-title">前缀 / 起源 ASN 核对</h2>
      <form id="validate-form">
        <label for="prefix-input">IPv4 CIDR
          <input id="prefix-input" name="prefix" type="text"
                 placeholder="例如 198.51.100.0/24" autocomplete="off" required>
        </label>
        <label for="asn-input">起源 ASN
          <input id="asn-input" name="asn" type="text"
                 placeholder="例如 64500" autocomplete="off" required>
        </label>
        <button type="submit">核对</button>
      </form>
      <p id="validate-message" class="notice" role="alert"></p>
      <div id="validate-result" class="result hidden" aria-live="polite"></div>
    </section>
  </main>

  <footer>
    <small>同步期间不阻塞查询 · 仅完整同版数据可用于核对 · 断流或错误自动保留旧版</small>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
